services:
  api:
    build: .
    image: tren-api
    container_name: tren-api
    restart: unless-stopped
    ports:
      # Puerto de host FIJO. La app siempre queda en http://localhost:53354
      # (dentro del contenedor sigue escuchando en 8000).
      - "53354:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
