services:
  api:
    build: .
    image: tren-api
    container_name: tren-api
    restart: unless-stopped
    # DNS fijo (Cloudflare) para evitar fallas de resolución post-reboot.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      # Puerto de host FIJO y bindeado SOLO a localhost: la app queda accesible
      # únicamente desde el server (http://127.0.0.1:53354), nunca desde la red/IP
      # pública. El único camino de entrada es el Cloudflare Tunnel.
      # (Dentro del contenedor sigue escuchando en 8000.)
      - "127.0.0.1:53354:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
