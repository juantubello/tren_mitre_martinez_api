services:
  api:
    build: .
    image: tren-api
    container_name: tren-api
    restart: unless-stopped
    ports:
      # Sin puerto de host fijo => Docker asigna uno ALEATORIO (efímero).
      # Para saber cuál te tocó:  docker compose port api 8000
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
