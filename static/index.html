<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e3f6b" />
  <title>Tren Martínez</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg: #eef4f9;
      --card: #ffffff;
      --text: #0c2438;
      --muted: #5b7488;
      --accent: #1f97d6;
      --accent-deep: #0e3f6b;
      --line: #dbe7f0;
      --shadow: 0 6px 24px rgba(14, 63, 107, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #081521;
        --card: #10222f;
        --text: #e9f2f9;
        --muted: #9db6c8;
        --accent: #46b2e6;
        --accent-deep: #0b5a92;
        --line: #1d3242;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 2px 14px;
    }
    header img { width: 34px; height: 34px; border-radius: 9px; }
    header h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.02em; }
    header .sub { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }

    .tripToggle {
      width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
      border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-radius: 16px; padding: 13px 17px; margin-bottom: 14px;
      cursor: pointer; text-align: left;
      transition: transform .1s ease, background .15s ease;
    }
    .tripToggle:hover { background: color-mix(in srgb, var(--accent) 17%, transparent); }
    .tripToggle:active { transform: scale(0.99); }
    .tripToggle .tripMain { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .tripToggle .tripHint { font-size: 0.8rem; font-weight: 700; color: var(--accent); }
    .filtros {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    .segment button:disabled { opacity: 0.32; cursor: default; }
    label.field { display: block; }
    label.field > span {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 5px 2px;
    }
    select {
      width: 100%;
      appearance: none;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      box-shadow: var(--shadow);
    }
    .segment {
      display: flex;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .segment button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
    }
    .segment button.active {
      background: var(--accent);
      color: #fff;
    }

    .hero {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      color: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .hero .top { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; opacity: 0.9; }
    .hero .hora { font-size: 3.4rem; font-weight: 700; line-height: 1; margin: 8px 0 2px; letter-spacing: -0.03em; }
    .hero .cuando { font-size: 1.05rem; font-weight: 600; }
    .hero .rec { font-size: 0.8rem; opacity: 0.85; margin-top: 12px; line-height: 1.4; }

    h2.tit { font-size: 0.9rem; color: var(--muted); margin: 4px 2px 10px; font-weight: 600; }
    .lista { display: grid; gap: 8px; }
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 13px 15px;
      box-shadow: var(--shadow);
    }
    .item .h { font-size: 1.25rem; font-weight: 700; min-width: 62px; }
    .item .m { font-size: 0.85rem; color: var(--muted); flex: 1; }
    .item .badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    #masWrap { display: flex; justify-content: center; margin-top: 12px; }
    .vermas {
      border: 0; background: transparent; cursor: pointer;
      color: var(--accent); font-size: 0.92rem; font-weight: 700;
      padding: 8px 14px; border-radius: 999px;
    }
    .vermas:active { opacity: 0.6; }
    .msg { text-align: center; color: var(--muted); padding: 28px 10px; }
    .refreshWrap { display: flex; justify-content: center; margin: 2px 0 22px; }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 11px 24px;
      border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 13%, transparent);
      color: var(--accent); font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      transition: transform .1s ease, background .15s ease;
    }
    .refresh:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    .refresh:active { transform: scale(0.95); }
    .refresh svg { width: 18px; height: 18px; display: block; }
    .spin { animation: sp 0.8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    footer { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 18px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <img src="/icon.svg" alt="" />
    <div>
      <h1>Tren Martínez</h1>
      <div class="sub" id="sub">Línea Mitre · hacia Retiro</div>
    </div>
  </header>

  <button class="tripToggle" id="tripToggle">
    <span class="tripMain" id="tripLabel">🚆 Martínez → Retiro</span>
    <span class="tripHint" id="tripHint">⇄ tocá para Retiro → Tigre</span>
  </button>

  <div class="filtros">
    <label class="field">
      <span>Estación</span>
      <select id="estacion"></select>
    </label>
    <label class="field">
      <span>Sentido</span>
      <div class="segment" id="sentido">
        <button data-v="Retiro" class="active">→ Retiro</button>
        <button data-v="Tigre">→ Tigre</button>
      </div>
    </label>
    <label class="field">
      <span>Día</span>
      <div class="segment" id="dia">
        <button data-v="habil" class="active">Hábil</button>
        <button data-v="noHabil">Sáb / Dom / Fer.</button>
      </div>
    </label>
  </div>

  <div id="hero"></div>

  <div class="refreshWrap">
    <button class="refresh" id="refresh">
      <svg id="refIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <path d="M21 3v6h-6" />
      </svg>
      <span id="refText">Actualizar</span>
    </button>
  </div>

  <h2 class="tit">Siguientes trenes</h2>
  <div class="lista" id="lista"></div>
  <div id="masWrap"></div>

  <footer>
    Datos de <a href="https://www.horariostrenes.com.ar" target="_blank" rel="noopener">horariostrenes.com.ar</a>
  </footer>

  <script>
    const ESTACIONES = ["Retiro","L. de la Torre","Belgrano C","Núñez","Rivadavia",
      "Vte. López","Olivos","La Lucila","Martínez","Acassuso","San Isidro","Beccar",
      "Victoria","Virreyes","San Fernando","Carupá","Tigre"];

    const state = { estacion: "Martínez", sentido: "Retiro", dia: "habil" };

    // Poblar estaciones
    const selEst = document.getElementById("estacion");
    for (const e of ESTACIONES) {
      const o = document.createElement("option");
      o.value = e; o.textContent = e;
      if (e === state.estacion) o.selected = true;
      selEst.appendChild(o);
    }

    function setActive(id, val) {
      document.getElementById(id).querySelectorAll("button")
        .forEach(b => b.classList.toggle("active", b.dataset.v === val));
    }

    // En las cabeceras (Retiro / Tigre) solo existe un sentido posible.
    function normalizarSentido() {
      if (state.estacion === "Retiro") state.sentido = "Tigre";
      else if (state.estacion === "Tigre") state.sentido = "Retiro";
    }

    // Viajes favoritos para el botón de cambio rápido.
    const TRIPS = [
      { est: "Martínez", sen: "Retiro", label: "Martínez → Retiro" },
      { est: "Retiro", sen: "Tigre", label: "Retiro → Tigre" },
    ];
    let toggleNext = TRIPS[1];

    // Muestra el viaje actual y anticipa a cuál cambia el botón.
    function pintarToggle() {
      const idx = TRIPS.findIndex(t => t.est === state.estacion && t.sen === state.sentido);
      const mainLabel = idx !== -1 ? TRIPS[idx].label : `${state.estacion} → ${state.sentido}`;
      toggleNext = TRIPS[idx === 0 ? 1 : 0];   // el otro favorito (si es custom, ofrece el default)
      document.getElementById("tripLabel").textContent = "🚆 " + mainLabel;
      document.getElementById("tripHint").textContent = "⇄ tocá para " + toggleNext.label;
    }

    // Refleja el estado en todos los controles (select, segmentos, atajos).
    function syncControls() {
      selEst.value = state.estacion;
      setActive("sentido", state.sentido);
      setActive("dia", state.dia);
      document.getElementById("sentido").querySelectorAll("button").forEach(b => {
        b.disabled = (state.estacion === "Retiro" && b.dataset.v === "Retiro")
                  || (state.estacion === "Tigre" && b.dataset.v === "Tigre");
      });
      pintarToggle();
    }

    document.getElementById("sentido").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        if (b.disabled) return;
        state.sentido = b.dataset.v;
        syncControls();
        cargar();
      });
    });
    document.getElementById("dia").querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => { state.dia = b.dataset.v; syncControls(); cargar(); });
    });
    selEst.addEventListener("change", () => {
      state.estacion = selEst.value;
      normalizarSentido();
      syncControls();
      cargar();
    });
    document.getElementById("tripToggle").addEventListener("click", () => {
      state.estacion = toggleNext.est;
      state.sentido = toggleNext.sen;
      syncControls();
      cargar();
    });

    function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    function fmtMin(m) {
      if (m <= 0) return "llegando";
      if (m < 60) return `en ${m} min`;
      const h = Math.floor(m / 60), mm = m % 60;
      return mm ? `en ${h} h ${mm} min` : `en ${h} h`;
    }

    // Estado de la lista de siguientes trenes (con expandir/colapsar)
    const COLAPSADO = 5;
    let _rest = [], _dest = "", _expanded = false;

    function pintarLista() {
      const lista = document.getElementById("lista");
      const masWrap = document.getElementById("masWrap");
      if (!_rest.length) {
        lista.innerHTML = '<div class="msg">No hay más trenes por hoy.</div>';
        masWrap.innerHTML = "";
        return;
      }
      const items = _expanded ? _rest : _rest.slice(0, COLAPSADO);
      lista.innerHTML = items.map(t => `
        <div class="item">
          <div class="h">${esc(t.hora)}</div>
          <div class="m">hacia ${esc(_dest)}</div>
          <div class="badge">${esc(fmtMin(t.en_minutos))}</div>
        </div>`).join("");
      if (_rest.length > COLAPSADO) {
        masWrap.innerHTML = `<button class="vermas" id="vermas">${
          _expanded ? "Ver menos ▲" : `Ver todos los horarios (${_rest.length}) ▼`
        }</button>`;
        document.getElementById("vermas").addEventListener("click", () => {
          _expanded = !_expanded;
          pintarLista();
        });
      } else {
        masWrap.innerHTML = "";
      }
    }

    async function cargar() {
      const hero = document.getElementById("hero");
      const lista = document.getElementById("lista");
      const icon = document.getElementById("refIcon");
      document.getElementById("sub").textContent = `Línea Mitre · hacia ${state.sentido}`;
      icon.classList.add("spin");
      hero.innerHTML = '<div class="hero"><div class="cuando">Buscando trenes…</div></div>';
      lista.innerHTML = "";
      document.getElementById("masWrap").innerHTML = "";

      const q = new URLSearchParams({
        estacion: state.estacion, sentido: state.sentido,
        ramal: "tigre-retiro", dia: state.dia, limite: 100
      });
      try {
        const r = await fetch(`/api/proximos?${q}`);
        if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
        const d = await r.json();
        const p = d.proximo_tren;
        hero.innerHTML = `
          <div class="hero">
            <div class="top"><span>${esc(d.estacion)} → ${esc(d.sentido)}</span><span>consulta ${esc(d.hora_consulta)}</span></div>
            <div class="hora">${esc(p.hora)}</div>
            <div class="cuando">${fmtMin(p.en_minutos)}</div>
            <div class="rec">${esc(p.recorrido.join(" · "))}</div>
          </div>`;
        _rest = d.proximos_trenes.slice(1);
        _dest = d.sentido;
        _expanded = false;
        pintarLista();
      } catch (e) {
        hero.innerHTML = `<div class="hero"><div class="cuando">No se pudo cargar</div><div class="rec">${esc(e.message)}</div></div>`;
      } finally {
        icon.classList.remove("spin");
      }
    }

    document.getElementById("refresh").addEventListener("click", cargar);
    syncControls();
    cargar();
    // refresco automático al volver a la app
    document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
